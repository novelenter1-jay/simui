<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>심의 출석 현황판 (간사용)</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --navy:#14306B; --navy-deep:#0D2350; --teal:#0E7C86; --teal-soft:#E3F1F2;
  --bg:#F4F6FA; --card:#fff; --ink:#1B2233; --sub:#5A657D; --line:#E2E7F0;
  --ok:#1D8A4E; --ok-soft:#E5F4EB; --no:#C4372F; --no-soft:#FBEAE8; --hold:#B57A0F; --hold-soft:#FBF2DF;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
button{font:inherit;cursor:pointer;border:none;background:none;-webkit-tap-highlight-color:transparent}
.hero{background:linear-gradient(135deg,var(--navy-deep),var(--navy) 45%,var(--teal));color:#fff;padding:22px 16px 18px;border-radius:0 0 20px 20px}
.hero .inner{max-width:760px;margin:0 auto}
.hero .org{font-size:12px;letter-spacing:.08em;opacity:.85;font-weight:600}
.hero h1{font-size:19px;font-weight:800;margin-top:4px}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 60px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;box-shadow:0 1px 3px rgba(20,48,107,.06)}
.panel h2{font-size:16px;font-weight:800;margin-bottom:4px}
.panel .desc{font-size:13px;color:var(--sub);margin-bottom:14px}
.field{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;font:inherit;font-size:16px;margin-bottom:10px}
.field:focus{outline:2px solid var(--teal);border-color:var(--teal)}
.primary{width:100%;background:var(--navy);color:#fff;border-radius:12px;padding:14px;font-size:16px;font-weight:800}
.err{color:var(--no);font-size:13px;font-weight:600;margin:4px 0 8px;min-height:18px}
.login{max-width:400px;margin:40px auto 0}
/* 달력 */
.cal{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-head .title{font-size:16px;font-weight:800}
.cal-head button{width:36px;height:36px;border-radius:10px;font-size:18px;color:var(--navy);font-weight:800}
.cal-head button:active{background:var(--teal-soft)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.cal-grid .dowh{font-size:11px;font-weight:700;color:var(--sub);padding:4px 0}
.cal-grid .dowh:first-child{color:var(--no)}
.cday{position:relative;padding:8px 0 16px;border-radius:10px;font-size:14px;font-weight:600;border:1.5px solid transparent}
.cday.dim{color:#B9C2D4}
.cday.today{outline:2px solid var(--teal)}
.cday.has{background:#F0F5F6;cursor:pointer}
.cday.has.met{background:var(--ok-soft)}
.cday.has.warn{background:var(--hold-soft)}
.cday.has.riskday{background:var(--no-soft)}
.cday.sel{border-color:var(--navy);background:var(--navy)!important;color:#fff}
.cday .cnt{position:absolute;bottom:3px;left:0;right:0;font-size:10px;font-weight:800;color:var(--sub)}
.cday .pdot{position:absolute;top:4px;right:5px;width:8px;height:8px;border-radius:99px;background:#8A94A8;border:1.5px solid #fff}
.cday.sel .pdot{background:#fff;border-color:var(--navy)}
.cday.met .cnt{color:var(--ok)} .cday.warn .cnt{color:var(--hold)} .cday.riskday .cnt{color:var(--no)} .cday.sel .cnt{color:#fff}
.callegend{display:flex;gap:12px;margin-top:10px;font-size:11px;color:var(--sub);flex-wrap:wrap}
.callegend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:4px;vertical-align:-2px}
/* 필터 바 */
.filters{display:flex;gap:8px;margin:4px 0 14px;flex-wrap:wrap;align-items:center}
.filters select{border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;font:inherit;font-size:14px;background:#fff;font-weight:700;color:var(--navy)}
.filters .cnt{margin-left:auto;font-size:12px;color:var(--sub);font-weight:600}
/* 요약 스트립 */
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.summary .s{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.summary .n{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.summary .l{font-size:11px;font-weight:700;color:var(--sub)}
.summary .s.met .n{color:var(--ok)} .summary .s.risk .n{color:var(--no)} .summary .s.wait .n{color:var(--hold)}
/* 날짜 그룹 */
.dhead{font-size:14px;font-weight:800;color:var(--navy);margin:20px 2px 8px;display:flex;align-items:center;gap:8px}
.dhead .bar{flex:1;height:1px;background:var(--line)}
.sess{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:10px}
.sess.risk{border-color:var(--no);background:linear-gradient(0deg,rgba(196,55,47,.04),rgba(196,55,47,.04)),#fff}
.sess .top{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.sess .time{font-size:16px;font-weight:800;color:var(--teal)}
.sess .room{font-size:12px;font-weight:700;color:var(--sub);background:var(--bg);border-radius:6px;padding:2px 8px}
.sess .subno{font-size:12px;font-weight:800;color:var(--navy);background:var(--teal-soft);border-radius:6px;padding:2px 8px}
.sess .gansa{font-size:12px;font-weight:700;color:var(--sub)}
.sess .no{margin-left:auto;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.sess .school{margin-top:5px;font-size:15px;font-weight:700}
.verdict{margin-top:10px;display:flex;align-items:center;gap:8px}
.q-cells{display:flex;gap:4px;flex:1;max-width:280px}
.q-cell{height:10px;flex:1;border-radius:4px;background:#E5EAF3;border:1px solid #D6DDEA}
.q-cell.ok{background:var(--ok);border-color:var(--ok)}
.q-cell.no{background:var(--no);border-color:var(--no)}
.q-cell.hold{background:var(--hold);border-color:var(--hold)}
.vlabel{font-size:13px;font-weight:800;white-space:nowrap}
.vlabel.met{color:var(--ok)} .vlabel.risk{color:var(--no)} .vlabel.wait{color:var(--hold)}
.mgrid{margin-top:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.mchip{display:flex;align-items:center;gap:6px;border-radius:9px;padding:6px 9px;font-size:13px;font-weight:700;border:1px solid var(--line);background:#FAFBFE;color:var(--sub)}
.mchip.ok{background:var(--ok-soft);border-color:#BFE3CD;color:var(--ok)}
.mchip.no{background:var(--no-soft);border-color:#F0C4C0;color:var(--no)}
.mchip.hold{background:var(--hold-soft);border-color:#EAD3A8;color:var(--hold)}
.mchip .rs{font-size:11px;font-weight:600;margin-left:auto;text-align:right}
.empty{text-align:center;color:var(--sub);font-size:14px;padding:36px 0}
.foot{margin-top:24px;text-align:center;font-size:12px;color:var(--sub)}
.live{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--ok)}
.live::before{content:'';width:7px;height:7px;border-radius:99px;background:var(--ok)}
.hide{display:none}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="hero"><div class="inner">
  <div class="org">화성오산교육지원청 생활교육과 · 간사용</div>
  <h1>학교폭력대책심의위원회 출석 현황판</h1>
</div></div>
<div class="wrap">
  <div id="gate" class="login panel">
    <h2>간사용 현황판 접속</h2>
    <div class="desc">안내받은 간사용 코드를 입력하세요.</div>
    <input class="field" id="code" type="password" autocomplete="off" placeholder="간사용 코드">
    <div class="err" id="err"></div>
    <button class="primary" id="go">확인</button>
  </div>
  <div id="app" class="hide"></div>
  <div class="foot hide" id="foot"><span class="live">실시간 반영 중</span> — 위원이 체크하면 즉시 갱신됩니다</div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, getDoc, collection, query, where, onSnapshot }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// ▼▼▼ index.html / admin.html과 동일한 Firebase config를 붙여넣으세요 ▼▼▼
const firebaseConfig = {
  apiKey: "AIzaSyACkEi9M-WQMJQbTfCvEdJJHiJpz-8MrZw",
  authDomain: "simui-attend.firebaseapp.com",
  projectId: "simui-attend",
  storageBucket: "simui-attend.firebasestorage.app",
  messagingSenderId: "430424190125",
  appId: "1:430424190125:web:f61e98821df18639ca2a24"
};
// ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function sha256(t){ const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
const todayStr = ()=>{ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const STCLS = { '출석':'ok','불출석':'no','미정':'hold' };

let cfg = { quorum: 4, gansaHash: '', codeHash: {} };
let rosters = {}, sessions = [], att = {};
let fGansa = '전체';
let calMonth = null, selDate = null;

async function boot(){
  await signInAnonymously(auth).catch(()=>{});
  const pub = await getDoc(doc(db,'config','public'));
  if (pub.exists()) Object.assign(cfg, pub.data());
  if (sessionStorage.getItem('sv_gansa')==='1'){ enter(); return; }
  $('#go').onclick = tryCode;
  $('#code').addEventListener('keydown', e=>{ if(e.key==='Enter') tryCode(); });
}
async function tryCode(){
  const v = $('#code').value.trim();
  if (!v) return;
  const h = await sha256(v);
  const ok = (cfg.gansaHash && h===cfg.gansaHash)
          || Object.values(cfg.codeHash||{}).includes(h); // 간사 코드 미설정 시 소위 코드로도 입장 가능
  if (!ok){ $('#err').textContent = '코드가 일치하지 않습니다.'; return; }
  sessionStorage.setItem('sv_gansa','1');
  enter();
}
function enter(){
  $('#gate').classList.add('hide');
  $('#app').classList.remove('hide');
  $('#foot').classList.remove('hide');
  onSnapshot(collection(db,'roster'), snap=>{ rosters={}; snap.forEach(d=>rosters[d.data().sub]=d.data()); render(); });
  onSnapshot(query(collection(db,'sessions'), where('date','>=',todayStr())), snap=>{
    sessions = snap.docs.map(d=>d.data()).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)); render();
  });
  onSnapshot(collection(db,'attendance'), snap=>{
    att={}; snap.forEach(d=>{ const a=d.data(); (att[a.session] ||= {})[a.name]=a; }); render();
  });
}

function calc(s){
  const members = (rosters[s.sub]?.members||[]);
  const total = members.length || 7;
  const a = att[s.id]||{};
  const ok=[], no=[], hold=[], none=[];
  members.forEach(m=>{
    const st = a[m.name]?.status;
    if (st==='출석') ok.push(m); else if (st==='불출석') no.push(m); else if (st==='미정') hold.push(m); else none.push(m);
  });
  const q = cfg.quorum||4;
  const met = ok.length>=q, risk = total-no.length<q;
  return { members, total, a, ok, no, hold, none, q, met, risk };
}

function render(){
  if (!sessions.length){ $('#app').innerHTML = '<div class="empty">다가오는 심의 일정이 없습니다.</div>'; return; }
  const gansas = [...new Set(sessions.map(s=>s.gansa.replace(/\s*[\[(].*$/,'').trim()).filter(Boolean))].sort();
  let list = sessions.filter(s=>!s.cancelled);
  if (fGansa!=='전체') list = list.filter(s=>s.gansa.includes(fGansa));

  const byDate = {};
  list.forEach(s=>{ (byDate[s.date] ||= []).push(s); });
  const dates = Object.keys(byDate).sort();

  // 기본 선택: 오늘 또는 다음 심의일
  const t = todayStr();
  if (!selDate || !byDate[selDate]) selDate = dates.find(d=>d>=t) || dates[0] || null;
  if (!calMonth) calMonth = (selDate || t).slice(0,7);

  // 요약
  let nMet=0,nRisk=0,nWait=0;
  list.forEach(s=>{ const c=calc(s); if(c.met)nMet++; else if(c.risk)nRisk++; else nWait++; });

  // 달력
  const [y,m] = calMonth.split('-').map(Number);
  const start = new Date(y, m-1, 1).getDay();
  const dim = new Date(y, m, 0).getDate();
  let cells = ['일','월','화','수','목','금','토'].map(d=>`<div class="dowh">${d}</div>`).join('');
  for (let i=0;i<start;i++) cells += '<div class="cday dim"></div>';
  for (let d=1; d<=dim; d++){
    const ds = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const ss = byDate[ds] || [];
    let dayCls = '', hasPending = false;
    if (ss.length){
      const cs = ss.map(calc);
      dayCls = cs.some(c=>c.risk) ? 'riskday' : (cs.every(c=>c.met) ? 'met' : 'warn');
      hasPending = cs.some(c=>c.none.length>0 || c.hold.length>0); // 미응답·미정 모두 챙길 대상
    }
    cells += `<div class="cday ${ss.length?'has '+dayCls:''} ${ds===t?'today':''} ${ds===selDate?'sel':''}" ${ss.length?`data-d="${ds}"`:''}>${d}${hasPending?'<span class="pdot" title="미응답 위원 있음"></span>':''}${ss.length?`<div class="cnt">${ss.length}건</div>`:''}</div>`;
  }

  // 선택 날짜 상세
  let detail = '<div class="empty">달력에서 날짜를 선택하세요.</div>';
  if (selDate && byDate[selDate]){
    const [sy,sm,sd] = selDate.split('-');
    const daySs = byDate[selDate].sort((a,b)=>(a.time+a.sub).localeCompare(b.time+b.sub));
    detail = `<div class="dhead">${parseInt(sm)}월 ${parseInt(sd)}일 (${esc(daySs[0].dow||'')}) · ${daySs.length}건<div class="bar"></div></div>` +
      daySs.map(s=>{
        const c = calc(s);
        let qc='';
        for (let i=0;i<c.total;i++) qc += `<div class="q-cell ${i<c.ok.length?'ok': i<c.ok.length+c.no.length?'no': i<c.ok.length+c.no.length+c.hold.length?'hold':''}"></div>`;
        const vl = c.met?`<span class="vlabel met">정족수 충족 ${c.ok.length}/${c.total}</span>`
                 : c.risk?`<span class="vlabel risk">미달 위험 · 불출석 ${c.no.length}명</span>`
                 : `<span class="vlabel wait">출석 ${c.ok.length}/${c.total} · ${c.q}명 필요</span>`;
        const chips = c.members.map(mm=>{
          const a = c.a[mm.name];
          const cls = a?STCLS[a.status]:'';
          return `<div class="mchip ${cls}">${mm.chair?'★ ':''}${esc(mm.name)}<span class="rs">${a?esc(a.status)+(a.reason?`·${esc(a.reason)}`:''):'미응답'}</span></div>`;
        }).join('');
        return `<div class="sess ${c.risk?'risk':''}">
          <div class="top">
            <span class="time">${esc(s.time)}</span>
            ${s.room?`<span class="room">${esc(s.room)}</span>`:''}
            <span class="subno">${s.sub}소위</span>
            <span class="gansa">간사 ${esc(s.gansa)}</span>
            <span class="no">${esc(s.simui)}</span>
          </div>
          <div class="school">${esc(s.school)}</div>
          <div class="verdict"><div class="q-cells">${qc}</div>${vl}</div>
          <div class="mgrid">${chips}</div>
        </div>`;
      }).join('');
  }

  $('#app').innerHTML = `
    <div class="filters">
      <select id="fg">${['전체',...gansas].map(g=>`<option ${g===fGansa?'selected':''}>${esc(g)}</option>`).join('')}</select>
      <span class="cnt">간사를 선택하면 달력도 함께 좁혀집니다</span>
    </div>
    <div class="summary">
      <div class="s met"><div class="n">${nMet}</div><div class="l">정족수 충족</div></div>
      <div class="s wait"><div class="n">${nWait}</div><div class="l">확인 중</div></div>
      <div class="s risk"><div class="n">${nRisk}</div><div class="l">미달 위험</div></div>
    </div>
    <div class="cal">
      <div class="cal-head">
        <button id="pm" aria-label="이전 달">‹</button>
        <div class="title">${y}년 ${m}월</div>
        <button id="nm" aria-label="다음 달">›</button>
      </div>
      <div class="cal-grid">${cells}</div>
      <div class="callegend">
        <span><i style="background:var(--ok-soft);border:1px solid #BFE3CD"></i>전건 충족</span>
        <span><i style="background:var(--hold-soft);border:1px solid #EAD3A8"></i>확인 중 포함</span>
        <span><i style="background:var(--no-soft);border:1px solid #F0C4C0"></i>미달 위험 포함</span>
        <span><i style="background:#8A94A8;border-radius:99px"></i>미응답·미정 위원 있음</span>
      </div>
    </div>
    <div id="dayDetail">${detail}</div>`;

  $('#fg').onchange = e=>{ fGansa=e.target.value; selDate=null; render(); };
  $('#pm').onclick = ()=>{ shiftMonth(-1); };
  $('#nm').onclick = ()=>{ shiftMonth(1); };
  function shiftMonth(dir){
    let [yy,mm] = calMonth.split('-').map(Number);
    mm += dir; if (mm<1){mm=12;yy--;} if(mm>12){mm=1;yy++;}
    calMonth = `${yy}-${String(mm).padStart(2,'0')}`;
    render();
  }
  $('#app').querySelectorAll('.cday.has').forEach(el=>el.onclick=()=>{
    selDate = el.dataset.d; render();
    document.getElementById('dayDetail')?.scrollIntoView({behavior:'smooth', block:'start'});
  });
}
boot();
</script>
</body>
</html>
